[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kusama-v2"
version = "0.1.0"
description = "A reproducible first image-editing experiment with FLUX.2 klein base 4B."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.14.0",
  "diffusers==0.40.0",
  "fastapi==0.141.1",
  "huggingface-hub==1.30.0",
  "numpy==2.4.6",
  "pillow==12.3.0",
  "psutil==7.2.2",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "safetensors==0.8.0",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "transformers==5.16.1",
  "uvicorn==0.52.4",
]

[project.scripts]
kusama = "kusama.cli:main"
kusama-first-edit = "kusama.experiment:main"
kusama-edit = "kusama.controlled:main"
kusama-benchmark = "kusama.benchmark:main"
kusama-dashboard = "kusama.dashboard:main"
kusama-studio = "kusama.studio_cli:main"
kusama-direct = "kusama.directed:main"
kusama-creative = "kusama.creative:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kusama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
